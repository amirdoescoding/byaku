name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # ponytail: no-op until Package.swift lands (v0 spike); then this becomes the real gate.
      - name: Check for Swift package
        id: pkg
        run: echo "exists=$([ -f Package.swift ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.pkg.outputs.exists == 'true'
        run: swift build
      - name: Test
        if: steps.pkg.outputs.exists == 'true'
        run: swift test
